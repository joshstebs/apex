name: ApexVoice offline checks

on:
  push:
    branches: [main, feature/apex-security-qa]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  reliability:
    name: Python and call simulation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r qa/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: python -m compileall -q app.py config.py database.py telephony.py voice_engine.py api qa
      - run: python -m qa.run_legacy
      - run: python -m pytest -q qa/test_calls.py --junitxml=call-checks.xml
      - run: python -m qa.benchmark --check --output offline-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-call-results
          path: |
            call-checks.xml
            offline-benchmark.json
          if-no-files-found: ignore

  browser:
    name: Commercial Chromium tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r qa/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select commercial files
        run: |
          set -euo pipefail
          if [ -f static/commercial/onboarding.html ]; then
            echo "COMMERCIAL_ROOT=static/commercial" >> "$GITHUB_ENV"
          else
            pr7=1567c013da05ea75af76e492449c93ecf4b24ae6
            git fetch --no-tags origin "$pr7"
            mkdir -p "$RUNNER_TEMP/apex-commercial"
            git archive "$pr7" static/commercial | tar -x -C "$RUNNER_TEMP/apex-commercial"
            echo "COMMERCIAL_ROOT=$RUNNER_TEMP/apex-commercial/static/commercial" >> "$GITHUB_ENV"
            echo "COMMERCIAL_FLAGS=--commercial-snapshot" >> "$GITHUB_ENV"
          fi
      - run: |
          python -m pytest -q qa/test_commercial.py --commercial-root "$COMMERCIAL_ROOT" \
            ${COMMERCIAL_FLAGS:-} --junitxml=commercial-checks.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-browser-results
          path: commercial-checks.xml
          if-no-files-found: ignore

  security:
    name: Security and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Scan application source
        run: |
          bandit -r -f json -o bandit-report.json app.py api config.py database.py telephony.py voice_engine.py --exit-zero
          bandit -r -lll app.py api config.py database.py telephony.py voice_engine.py
      - name: Resolve and audit runtime dependencies
        run: pip-audit -r requirements.txt --format json --output dependency-audit.json
      - name: Scan tracked files and new commits for secrets
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v$version"
          curl --fail --silent --show-error --location "$release/$archive" -o "$RUNNER_TEMP/$archive"
          digest=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/apex-tracked"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/apex-tracked"
          "$RUNNER_TEMP/gitleaks" --config .gitleaks.toml dir "$RUNNER_TEMP/apex-tracked" --redact=100 --report-format json --report-path "$PWD/secret-snapshot.json"
          base=${PR_BASE:-${MERGE_BASE:-${PUSH_BEFORE:-}}}
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git merge-base HEAD origin/main)
          fi
          "$RUNNER_TEMP/gitleaks" --config .gitleaks.toml git --log-opts="$base..HEAD" --redact=100 --report-format json --report-path "$PWD/secret-changes.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-report.json
            dependency-audit.json
            secret-snapshot.json
            secret-changes.json
          if-no-files-found: ignore

  container:
    name: ARM64 offline container
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash qa/container_smoke.sh linux/arm64

  required:
    name: ApexVoice required checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs: [reliability, browser, security, container]
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success")' <<< "$RESULTS"

  production:
    name: ApexVoice main promotion check
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful offline checks
        env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m qa.production_gate
