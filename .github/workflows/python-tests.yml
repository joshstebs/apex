name: ApexVoice offline checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m compileall -q app.py config.py database.py telephony.py voice_engine.py api test_hm_receptionist.py
      - run: python test_security_regressions.py
      - run: python test_audio_retries.py
      - run: python test_safe_fallbacks.py
      - run: python test_hm_receptionist.py
      - run: python test_signalwire_elevenlabs_setup.py
